.cur{animation:cur 1.1s steps(1,end) infinite}
@keyframes cur{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
text{text-anchor:middle}
.n{font:700 88px "Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;letter-spacing:-1.5px}
.s{font:500 31px "Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;fill:#C9D6E6}
.t{font:500 24px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#34D399}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060B14"/><stop offset="1" stop-color="#0D2230"/></linearGradient>
<linearGradient id="g" x1="200" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#60A5FA"/><stop offset=".55" stop-color="#22D3EE"/><stop offset="1" stop-color="#34D399"/></linearGradient>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#E4ECF6" opacity=".09"/></pattern>
<clipPath id="c"><rect width="1200" height="320" rx="20"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="1200" height="320" fill="url(#bg)"/>
<rect width="1200" height="320" fill="url(#dots)"/>
<path class="a" d="M0 268 Q150.0 246 300.0 268 T600 268 Q750.0 246 900.0 268 T1200 268 Q1350.0 246 1500.0 268 T1800 268 Q1950.0 246 2100.0 268 T2400 268 V320 H0 Z" fill="#22D3EE" opacity=".1"/>
<path class="b" d="M0 286 Q150.0 270 300.0 286 T600 286 Q750.0 270 900.0 286 T1200 286 Q1350.0 270 1500.0 286 T1800 286 Q1950.0 270 2100.0 286 T2400 286 V320 H0 Z" fill="#60A5FA" opacity=".13"/>
<text class="n" x="600" y="136" fill="url(#g)">Didulana Lokugamage</text>
<text class="s" x="600" y="190">Computer Engineering Undergraduate · University of Peradeniya</text>
