<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Didulana Lokugamage, Computer Engineering Undergraduate at the University of Peradeniya">
<title>Didulana Lokugamage</title>
<style>
.a{animation:d 18s linear infinite}
.b{animation:d 11s linear infinite reverse}
